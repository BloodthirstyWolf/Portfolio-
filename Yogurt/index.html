<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кейс: Продвижение кафе</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: white;
            overflow-x: hidden;
        }
        .section {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }
        .hero {
            background: #fee6ed; /* Сплошной розовый фон */
            flex-direction: column;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .hero h1 {
            font-size: 3rem;
            color: white;
        }
        .hero p {
            font-size: 1.5rem;
            color: white;
            margin-top: 10px;
        }
        .parallax-img {
            position: absolute;
            width: 15vw;
            height: auto;
            transition: transform 0.1s ease-out;
            z-index: 100;
            pointer-events: none;
        }
        
        /* Новый фон для второго контейнера */
        .results-container {
            position: absolute;
            top: 100vh; /* Позиционируем контейнер сразу после первого */
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #fee6ed, #dbeafe); /* Градиент от розового до голубого */
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 30px;
            align-items: center;
            justify-items: center;
        }

        /* Результаты - белые квадраты с круглыми краями */
        .result {
            background: white;
            width: 200px;
            height: 200px;
            border-radius: 16px;
            text-align: center;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out;
        }

        .result:hover {
            transform: translateY(-5px);
        }

        .icon {
            font-size: 32px;
        }

        .number {
            font-size: 36px;
            font-weight: bold;
            color: #ff4081;
            margin: 10px 0;
        }

    </style>
</head>
<body>
    <div class="section hero">
        <h1>Как я помогла кафе продвинуть уникальный продукт</h1>
        <p>Публикация привела к росту ссылочной массы и помогла бренду привлечь новых клиентов.</p>
        <img src="yogurt1.png" class="parallax-img" style="top: 20%; left: 15%;">
        <img src="yogurt2.png" class="parallax-img" style="top: 50%; left: 50%;">
        <img src="yogurt1.png" class="parallax-img" style="top: 70%; left: 80%;">
    </div>
    
    <!-- Контейнер 2 -->
    <div class="results-container">
        <div class="result">
            <div class="icon">📈</div>
            <div class="number">10%</div>
            <p>Рост трафика извне</p>
        </div>
        <div class="result">
            <div class="icon">🕒</div>
            <div class="number">+35%</div>
            <p>Увеличение времени на странице</p>
        </div>
        <div class="result">
            <div class="icon">📝</div>
            <div class="number">5+</div>
            <p>Статей в топе</p>
        </div>
        <div class="result">
            <div class="icon">💬</div>
            <div class="number">X2</div>
            <p>Рост комментариев</p>
        </div>
    </div>

    <script>
        document.addEventListener("mousemove", (e) => {
            document.querySelectorAll(".parallax-img").forEach(img => {
                let speed = 5;
                let x = (window.innerWidth - e.pageX * speed) / 100;
                let y = (window.innerHeight - e.pageY * speed) / 100;
                img.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
