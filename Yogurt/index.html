<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кейс: Продвижение кафе</title>
    <style>
        @font-face {
            font-family: 'Impact';
            src: url('Impact_Regular.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Bebas Neue';
            src: url('Bebas_Neue.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: white;
            overflow-x: hidden;
        }
        .section {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }
        .hero {
            background: #fee6ed;
            flex-direction: column;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .hero .hero-text {
            z-index: 0;
            font-family: 'Impact', sans-serif;
            width: 80vw;
        }
        
        .hero-text h1,
        .hero-text p {
            width: 100%;
            white-space: nowrap;
            overflow: visible;
            font-size: 10vw;
        }

        .hero-text h1 {
            font-family: 'Impact', sans-serif;
            font-size: clamp(1rem, 10vw, 6rem);
            line-height: 1;
        }

        .hero-text p {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(0.8rem, 6vw, 4rem);
            line-height: 1;
        }

        .parallax-img {
            position: absolute;
            width: 15vw;
            height: auto;
            transition: transform 0.1s ease-out;
            z-index: 100;
            pointer-events: none;
        }

        .parallax-img-small {
            width: 10vw;
            z-index: -5;
        }

        .container2 {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #fee6ed, #dbeafe);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .result-container {
            width: 40%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10%;
            text-align: center;
        }

        .result {
            background: white;
            width: 250px;
            height: 250px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .result:hover {
            transform: translateY(-5px);
        }

        .icon {
    font-size: 2rem; /* Увеличиваем эмодзи */
    margin-bottom: 10px; /* Отступ вниз */
}


        @media (max-width: 768px) {
            .container2 {
    width: 100vw;
    height: auto; /* В мобильной версии высота будет автоматически рассчитываться */
    min-height: 100vh; /* Гарантирует, что секция будет занимать хотя бы всю высоту экрана */
    background: linear-gradient(to bottom, #fee6ed, #dbeafe);
    display: flex;
    justify-content: center;
    align-items: center;
}

.result-container {
    width: 40%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10%;
    text-align: center;
}

@media (max-width: 768px) {
    .container2 {
        height: auto;
        min-height: 100vh; /* Гарантируем, что в мобильной версии контейнер всё равно растягивается на весь экран */
    }

    .result-container {
        display: flex;
        flex-direction: column;
        justify-content: space-between; /* Равномерно распределим элементы по вертикали */
        align-items: center; /* Центрируем по горизонтали */
        width: 100%; /* Растягиваем контейнер по ширине */
    }

    .result {
        width: 90%;
        height: auto;
        margin-bottom: 20px;
    }
}

    </style>
</head>
<body>
    <div class="section hero">
        <div class="hero-text">
            <h1>Как я помогла кафе продвинуть уникальный продукт</h1>
            <p>Публикация привела к росту ссылочной массы и помогла бренду привлечь новых клиентов.</p>
        </div>

        <!-- Мелкие изображения -->
        <img src="yogurt3.webp" class="parallax-img parallax-img-small" style="top: 10%; left: 10%;" data-speed="10">
        <img src="yogurt4.webp" class="parallax-img parallax-img-small" style="top: 40%; left: 50%;" data-speed="8">
        <img src="yogurt5.png" class="parallax-img parallax-img-small" style="top: 60%; left: 80%;" data-speed="6">
        <img src="yogurt3.webp" class="parallax-img parallax-img-small" style="top: 80%; left: 40%;" data-speed="4">
        <img src="yogurt4.webp" class="parallax-img parallax-img-small" style="top: 10%; left: 0%;" data-speed="2">

        <!-- Большие изображения -->
        <img src="yogurt1.png" class="parallax-img" style="top: 60%; left: 5%;" data-speed="15">
        <img src="yogurt2.png" class="parallax-img" style="top: -10%; left: 50%;" data-speed="12">
        <img src="yogurt1.png" class="parallax-img" style="top: 90%; left: 80%;" data-speed="10">
    </div>

    <div class="container2">
        <div class="result-container">
    <div class="result">
    <div class="icon">📈</div>
    <div class="number">10%</div>
    <p>Рост трафика</p>
</div>
<div class="result">
    <div class="icon">🕒</div>
    <div class="number">+35%</div>
    <p>Время на странице</p>
</div>
<div class="result">
    <div class="icon">📝</div>
    <div class="number">5+</div>
    <p>Статей в топе</p>
</div>
<div class="result">
    <div class="icon">💬</div>
    <div class="number">X2</div>
    <p>Рост комментариев</p>
</div>

    </div>

    <script>
document.addEventListener("DOMContentLoaded", () => {
    const parallaxImages = document.querySelectorAll(".parallax-img");

    function updateParallax(x, y) {
        parallaxImages.forEach(img => {
            let speed = parseFloat(img.getAttribute("data-speed"));
            let xOffset = ((window.innerWidth / 2 - x) * speed) / 30;  
            let yOffset = ((window.innerHeight / 2 - y) * speed) / 30;  
            img.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
        });
    }

    document.addEventListener("mousemove", (e) => {
        if (!window.isMobile) updateParallax(e.clientX, e.clientY);
    });

    function isMobileDevice() {
        return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    }
    window.isMobile = isMobileDevice();

    if (window.isMobile && window.DeviceOrientationEvent) {
        window.addEventListener("deviceorientation", (event) => {
            let x = event.gamma;
            let y = event.beta;
            if (x !== null && y !== null) {
                let mappedX = (x + 180) * (window.innerWidth / 360); 
                let mappedY = (y + 180) * (window.innerHeight / 360);
                updateParallax(mappedX, mappedY);
            }
        });
    }

    // === ЛОГИКА АДАПТИВНОГО ЗАГОЛОВКА (ОДНА СТРОКА) ===
    function adjustTextSize() {
        document.querySelectorAll('.hero-text h1, .hero-text p').forEach(fitTextToOneLine);
    }

    function fitTextToOneLine(element) {
        let container = element.parentElement;
        let maxWidth = container.clientWidth;
        let fontSize = 100;
        
        element.style.whiteSpace = "nowrap";  // В одну строку
        element.style.fontSize = fontSize + "px";

        while ((element.scrollWidth > maxWidth) && fontSize > 10) {
            fontSize -= 1;
            element.style.fontSize = fontSize + "px";
        }
    }

    const resizeObserver = new ResizeObserver(adjustTextSize);
    resizeObserver.observe(document.querySelector(".hero-text"));

    window.addEventListener('resize', adjustTextSize);
    window.addEventListener('load', () => {
        setTimeout(adjustTextSize, 100); // Даём браузеру дорисовать страницу
    });
});

    </script>
</body>
</html>
