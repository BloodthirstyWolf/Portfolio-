<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кейс: Продвижение кафе</title>
    <style>

        @font-face {
            font-family: 'Impact';
            src: url('Impact_Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Bebas Neue';
            src: url('Bebas_Neue.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: white;
            overflow-x: hidden;
        }
        .section {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }
        .hero {
            background: #fee6ed;
            flex-direction: column;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .hero-text {
            width: 80%;
            max-width: 1000px;
            text-align: center;
            position: relative;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hero-text h1, .hero-text p {
            white-space: nowrap;
            display: inline-block;
        }
        .hero-text h1 {
            font-family: 'Impact', sans-serif;
            color: white;
        }
        .hero-text p {
            font-family: 'Bebas Neue', sans-serif;
            color: white;
        }

        .parallax-img {
            position: absolute;
            width: 15vw;
            height: auto;
            transition: transform 0.1s ease-out;
            z-index: 100;
            pointer-events: none;
        }
        .parallax-img-small {
            width: 10vw;
            z-index: -5;
        }

    </style>
</head>
<body>
    <div class="section hero">
        <div class="hero-text">
            <h1>Как я помогла кафе продвинуть уникальный продукт</h1>
            <p>Публикация привела к росту ссылочной массы и помогла бренду привлечь новых клиентов.</p>
        </div>
    </div>

    <script>
        function adjustTextWidth() {
            let heroText = document.querySelector(".hero-text");
            let h1 = document.querySelector(".hero-text h1");
            let p = document.querySelector(".hero-text p");

            let containerWidth = heroText.clientWidth;

            h1.style.transform = "scale(1)";
            p.style.transform = "scale(1)";

            let h1Width = h1.scrollWidth;
            let pWidth = p.scrollWidth;

            let h1Scale = containerWidth / h1Width;
            let pScale = containerWidth / pWidth;

            let scale = Math.min(h1Scale, pScale);

            h1.style.transform = `scale(${scale})`;
            p.style.transform = `scale(${scale})`;
        }

        document.addEventListener("DOMContentLoaded", adjustTextWidth);
        window.addEventListener("resize", adjustTextWidth);
    </script>
</body>
</html>
