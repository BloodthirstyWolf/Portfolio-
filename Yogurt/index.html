<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кейс: Продвижение кафе</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: white;
            overflow-x: hidden;
        }
        /* Контейнер с розовым фоном */
        .container1 {
            width: 100vw;
            height: 100vh;
            background: #fee6ed; /* Сплошной розовый фон */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Контейнер для заголовка и подзаголовка */
        .hero-container {
            width: 80%; /* Ограничиваем ширину до 80% */
            text-align: center; /* Выравнивание текста по центру */
        }

        /* Заголовок */
        .hero h1 {
            font-size: 3rem;
            color: white;
            white-space: nowrap; /* Запрещаем перенос на новую строку */
            font-family: 'Impact', sans-serif;
            margin-bottom: 10px;
            width: fit-content; /* Подстраиваем ширину по содержимому */
            display: inline-block; /* Чтобы fit-content работал */
        }

        /* Подзаголовок */
        .hero p {
            font-size: 1.5rem;
            color: white;
            white-space: nowrap; /* Запрещаем перенос на новую строку */
            font-family: 'Impact', sans-serif;
            width: fit-content; /* Подстраиваем ширину по содержимому */
            display: inline-block; /* Чтобы fit-content работал */
        }

        /* Параллакс-изображения */
        .parallax-img {
            position: absolute;
            width: 15vw;
            height: auto;
            transition: transform 0.1s ease-out;
            z-index: 100;
            pointer-events: none;
        }

        /* Новый фон для второго контейнера */
        .container2 {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #fee6ed, #dbeafe); /* Градиент от розового до голубого */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер с результатами */
        .result-container {
            width: 40%; /* Ширина 50%, можно настроить */
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10%;
            text-align: center;
        }

        /* Результаты - белые квадраты с круглыми краями */
        .result {
            background: white;
            width: 250px;  /* Размер статистики */
            height: 250px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .result:hover {
            transform: translateY(-5px);
        }

        .icon {
            font-size: 40px; /* Увеличиваем иконки */
        }

        .number {
            font-size: 48px; /* Увеличиваем числа */
            font-weight: bold;
            color: #ff4081;
            margin: 10px 0;
        }

        /* Мобильная версия */
        @media (max-width: 768px) {
            .result-container {
                grid-template-columns: 1fr; /* В столбик на мобильных */
            }

            .result {
                width: 90%; /* Делаем статистику шире на маленьких экранах */
                height: auto;
                margin-bottom: 20px;
            }

            .icon {
                font-size: 36px;
            }

            .number {
                font-size: 42px;
            }
        }
    </style>
</head>
<body>
    <!-- Первый контейнер -->
    <div class="container1">
        <!-- Контейнер для заголовка и подзаголовка -->
        <div class="hero-container">
            <h1>Как я помогла кафе продвинуть уникальный продукт</h1>
            <p>Публикация привела к росту ссылочной массы и помогла бренду привлечь новых клиентов.</p>
        </div>
    </div>
    
    <!-- Второй контейнер -->
    <div class="container2">
        <div class="result-container">
            <div class="result">
                <div class="icon">📈</div>
                <div class="number">10%</div>
                <p>Рост трафика извне</p>
            </div>
            <div class="result">
                <div class="icon">🕒</div>
                <div class="number">+35%</div>
                <p>Увеличение времени на странице</p>
            </div>
            <div class="result">
                <div class="icon">📝</div>
                <div class="number">5+</div>
                <p>Статей в топе</p>
            </div>
            <div class="result">
                <div class="icon">💬</div>
                <div class="number">X2</div>
                <p>Рост комментариев</p>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener("mousemove", (e) => {
            document.querySelectorAll(".parallax-img").forEach(img => {
                let speed = parseFloat(img.getAttribute("data-speed"));
                let x = (window.innerWidth - e.pageX * speed) / 100;
                let y = (window.innerHeight - e.pageY * speed) / 100;
                img.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
