<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кейс: Продвижение кафе</title>
    <style>
        @font-face {
            font-family: 'Impact';
            src: url('Impact_Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Bebas Neue';
            src: url('Bebas_Neue.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: white;
            overflow-x: hidden;
        }
        .section {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }
        .hero {
            background: #fee6ed;
            flex-direction: column;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .hero-text {
            width: 80vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .hero-text h1,
        .hero-text p {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
        }

        .hero-text h1 {
            font-family: 'Impact', sans-serif;
            font-size: 10vw;
        }

        .hero-text p {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 10vw;
        }

        .parallax-img {
            position: absolute;
            width: 15vw;
            height: auto;
            transition: transform 0.1s ease-out;
            z-index: 100;
            pointer-events: none;
        }

        .parallax-img-small {
            width: 10vw;
            z-index: -5;
        }

        @media (max-width: 768px) {
            .parallax-img-small {
                width: 20vw;
            }
            .parallax-img {
                width: 30vw;
            }
        }
    </style>
</head>
<body>
    <div class="section hero">
        <div class="hero-text">
            <h1>Как я помогла кафе продвинуть уникальный продукт</h1>
            <p>Публикация привела к росту ссылочной массы и помогла бренду привлечь новых клиентов.</p>
        </div>

        <img src="yogurt3.webp" class="parallax-img" style="top: 10%; left: 10%;" data-speed="10">
        <img src="yogurt4.webp" class="parallax-img" style="top: 40%; left: 50%;" data-speed="8">
        <img src="yogurt5.png" class="parallax-img" style="top: 60%; left: 80%;" data-speed="6">
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const parallaxImages = document.querySelectorAll(".parallax-img");

            function updateParallax(x, y) {
                parallaxImages.forEach(img => {
                    let speed = parseFloat(img.getAttribute("data-speed"));
                    let xOffset = ((window.innerWidth / 2 - x) * speed) / 20;
                    let yOffset = ((window.innerHeight / 2 - y) * speed) / 20;
                    img.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
                });
            }

            document.addEventListener("mousemove", (e) => {
                if (!window.isMobile) {
                    updateParallax(e.clientX, e.clientY);
                }
            });

            function isMobileDevice() {
                return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            }
            window.isMobile = isMobileDevice();

            if (window.isMobile && window.DeviceOrientationEvent) {
                window.addEventListener("deviceorientation", (event) => {
                    let x = event.gamma; 
                    let y = event.beta;

                    x = Math.max(-90, Math.min(90, x));
                    y = Math.max(-90, Math.min(90, y));

                    let mappedX = ((x + 90) / 180) * window.innerWidth;
                    let mappedY = ((y + 90) / 180) * window.innerHeight;

                    updateParallax(mappedX, mappedY);
                });
            }
        });

        function adjustTextSize() {
            document.querySelectorAll('.hero-text h1, .hero-text p').forEach(fitTextToContainer);
        }

        function fitTextToContainer(element) {
            let container = element.parentElement;
            let maxWidth = container.clientWidth;
            let fontSize = 100;
            element.style.fontSize = fontSize + "px";

            while (element.scrollWidth > maxWidth && fontSize > 10) {
                fontSize -= 1;
                element.style.fontSize = fontSize + "px";
            }
        }

        const resizeObserver = new ResizeObserver(adjustTextSize);
        resizeObserver.observe(document.querySelector(".hero-text"));

        window.addEventListener('resize', adjustTextSize);
        window.addEventListener('load', adjustTextSize);
    </script>
</body>
</html>
