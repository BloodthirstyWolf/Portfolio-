<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кейс: Продвижение кафе</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: white;
            overflow-x: hidden;
        }
        .section {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }
        .hero {
            background: #fee6ed; /* Сплошной розовый фон */
            flex-direction: column;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .hero h1 {
            font-size: 3rem;
            color: white;
        }
        .hero p {
            font-size: 1.5rem;
            color: white;
            margin-top: 10px;
        }
        .parallax-img {
            position: absolute;
            width: 15vw;
            height: auto;
            transition: transform 0.1s ease-out;
            z-index: 100;
            pointer-events: none;
        }
        .section:nth-child(even) {
            background: #dbeafe;
        }
        .section:nth-child(odd) {
            background: #fde2e4;
        }

        /* Новый градиентный фон для второго контейнера */
        .gradient-background {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to top, #fee6ed, #dbeafe); /* Градиент от розового снизу до голубого сверху */
            z-index: 2;
        }

        /* Стили для второго контейнера */
        .results-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            background: linear-gradient(to bottom, #fee6ed, #dbeafe); /* Градиент от розового сверху до голубого снизу */
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
