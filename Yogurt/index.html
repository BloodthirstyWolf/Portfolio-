<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кейс: Продвижение кафе</title>
    <style>

        @font-face {
            font-family: 'Impact';
            src: url('Impact_Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Bebas Neue';
            src: url('Bebas_Neue.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            overflow-x: hidden;
        }

        .section {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        .hero {
            background: #fee6ed;
            flex-direction: column;
            text-align: center;
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-text {
            width: 80%;
            max-width: 1000px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-text h1,
        .hero-text p {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            display: block;
            text-align: center;
        }

        .hero-text h1 {
            font-family: 'Impact', sans-serif;
            color: white;
        }

        .hero-text p {
            font-family: 'Bebas Neue', sans-serif;
            color: white;
        }

        .scalable-text {
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: top left;
            width: fit-content;
        }

    </style>
</head>
<body>
    <div class="section hero">
        <div class="hero-text">
            <div class="scalable-text">
                <h1>Как я помогла кафе продвинуть уникальный продукт</h1>
            </div>
            <div class="scalable-text">
                <p>Публикация привела к росту ссылочной массы и помогла бренду привлечь новых клиентов.</p>
            </div>
        </div>
    </div>

    <script>
        function fitTextToContainer() {
            let heroText = document.querySelector(".hero-text");
            let textBlocks = document.querySelectorAll(".scalable-text");

            textBlocks.forEach(block => {
                let text = block.children[0];
                text.style.fontSize = "100px"; // Ставим большой размер, чтобы уменьшить
                let scaleFactor = heroText.clientWidth / text.clientWidth;
                text.style.transform = `scale(${scaleFactor})`;
            });
        }

        document.addEventListener("DOMContentLoaded", fitTextToContainer);
        window.addEventListener("resize", fitTextToContainer);
    </script>
</body>
</html>
