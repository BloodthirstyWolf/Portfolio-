<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кейс: Продвижение кафе</title>
    <style>
        @font-face {
            font-family: 'Impact';
            src: url('Impact_Regular.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Bebas Neue';
            src: url('Bebas_Neue.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: white;
            overflow-x: hidden;
        }
        .section {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }
        .hero {
            background: #fee6ed;
            flex-direction: column;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .hero .hero-text {
            z-index: 0;
            font-family: 'Impact', sans-serif;
            width: 80vw;
        }
        
        .hero-text h1,
        .hero-text p {
            width: 100%;
            white-space: nowrap;
            overflow: visible;
            font-size: 10vw;
        }

        .hero-text h1 {
            font-family: 'Impact', sans-serif;
            font-size: clamp(1rem, 10vw, 6rem);
            line-height: 1;
        }

        .hero-text p {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(0.8rem, 6vw, 4rem);
            line-height: 1;
        }

        .parallax-img {
            position: absolute;
            width: 15vw;
            height: auto;
            transition: transform 0.1s ease-out;
            z-index: 100;
            pointer-events: none;
        }

        .parallax-img-small {
            width: 10vw;
            z-index: -5;
        }

        /* Новый фон для второго контейнера */
        .container2 {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #fee6ed, #dbeafe); /* Градиент от розового до голубого */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер с результатами */
        .result-container {
            width: 40%; /* Ширина 50%, можно настроить */
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10%;
            text-align: center;
        }

        /* Результаты - белые квадраты с круглыми краями */
        .result {
            background: white;
            width: 250px;  /* Размер статистики */
            height: 250px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .result:hover {
            transform: translateY(-5px);
        }

        .icon {
    font-size: 40px;
    display: block; /* Чтобы эмодзи не были на одной линии с текстом */
    margin-bottom: 10px; /* Отступ перед числом */
}


        .number {
            font-size: 48px; /* Увеличиваем числа */
            font-weight: bold;
            color: #ff4081;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .result-container {
                grid-template-columns: 1fr;
            }
            .result {
                width: 90%;
                height: auto;
                margin-bottom: 20px;
            }

            .hero-text {
    width: 90vw; /* Контейнер чуть шире, чтобы текст вписался */
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    overflow: hidden; /* Без обрезаний */
}

.hero-text h1,
.hero-text p {
    width: 100%;
    white-space: normal; /* Позволяем перенос строк */
    word-wrap: break-word; /* Разрешаем перенос по словам */
    font-size: 10vw; /* Авторазмер */
}

.hero-text h1 {
    font-size: clamp(1rem, 8vw, 6rem); /* Больше контроля */
}

.hero-text p {
    font-size: clamp(0.8rem, 5vw, 3rem);
}
        }
    </style>
</head>
<body>
    <div class="section hero">
        <div class="hero-text">
            <h1>Как я помогла кафе продвинуть уникальный продукт</h1>
            <p>Публикация привела к росту ссылочной массы и помогла бренду привлечь новых клиентов.</p>
        </div>

        <!-- Мелкие изображения -->
        <img src="yogurt3.webp" class="parallax-img parallax-img-small" style="top: 10%; left: 10%;" data-speed="10">
        <img src="yogurt4.webp" class="parallax-img parallax-img-small" style="top: 40%; left: 50%;" data-speed="8">
        <img src="yogurt5.png" class="parallax-img parallax-img-small" style="top: 60%; left: 80%;" data-speed="6">
        <img src="yogurt3.webp" class="parallax-img parallax-img-small" style="top: 80%; left: 40%;" data-speed="4">
        <img src="yogurt4.webp" class="parallax-img parallax-img-small" style="top: 10%; left: 0%;" data-speed="2">

        <!-- Большие изображения -->
        <img src="yogurt1.png" class="parallax-img" style="top: 60%; left: 5%;" data-speed="15">
        <img src="yogurt2.png" class="parallax-img" style="top: -10%; left: 50%;" data-speed="12">
        <img src="yogurt1.png" class="parallax-img" style="top: 90%; left: 80%;" data-speed="10">
    </div>

   <div class="container2">
    <div class="result-container">
        <div class="result">
            <span class="icon">📈</span>
            <div class="number">10%</div>
            <p>Рост трафика</p>
        </div>
        <div class="result">
            <span class="icon">🕒</span>
            <div class="number">+35%</div>
            <p>Время на странице</p>
        </div>
        <div class="result">
            <span class="icon">📝</span>
            <div class="number">5+</div>
            <p>Статей в топе</p>
        </div>
        <div class="result">
            <span class="icon">💬</span>
            <div class="number">X2</div>
            <p>Рост комментариев</p>
        </div>
    </div>
</div>


    <script>
document.addEventListener("DOMContentLoaded", () => {
    const parallaxImages = document.querySelectorAll(".parallax-img");

    function updateParallax(x, y) {
        parallaxImages.forEach(img => {
            let speed = parseFloat(img.getAttribute("data-speed"));
            let xOffset = ((window.innerWidth / 2 - x) * speed) / 50; 
            let yOffset = ((window.innerHeight / 2 - y) * speed) / 50; 
            img.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
        });
    }

    // Обработка движения мыши (десктоп)
    document.addEventListener("mousemove", (e) => {
        if (!window.isMobile) {
            updateParallax(e.clientX, e.clientY);
        }
    });

    // Проверка мобильного устройства
    function isMobileDevice() {
        return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    window.isMobile = isMobileDevice();

    // Гироскопный параллакс (мобильные устройства)
    if (window.isMobile && window.DeviceOrientationEvent) {
        window.addEventListener("deviceorientation", (event) => {
            let x = event.gamma;  // Влево-вправо (-90 до 90)
            let y = event.beta;   // Вперёд-назад (-180 до 180)

            if (x !== null && y !== null) {
                // Увеличенный диапазон для плавности
                let mappedX = (x + 90) * (window.innerWidth / 180);
                let mappedY = (y + 90) * (window.innerHeight / 180);
                updateParallax(mappedX, mappedY);
            }
        });
    }
});

// ---------------- АДАПТИВНЫЙ ЗАГОЛОВОК ----------------
function adjustTextSize() {
    document.querySelectorAll('.hero-text h1, .hero-text p').forEach(fitTextToContainer);
}

function fitTextToContainer(element) {
    let container = element.parentElement;
    let maxWidth = container.clientWidth;
    let maxHeight = container.clientHeight;
    let fontSize = 100; // Начальный размер шрифта
    element.style.fontSize = fontSize + "px";

    // Уменьшение, пока текст не влезет
    while (
        (element.scrollWidth > maxWidth || element.scrollHeight > maxHeight) &&
        fontSize > 10
    ) {
        fontSize -= 1;
        element.style.fontSize = fontSize + "px";
    }
}

// Наблюдатель за изменением размеров
const resizeObserver = new ResizeObserver(adjustTextSize);
resizeObserver.observe(document.querySelector(".hero-text"));

window.addEventListener('resize', adjustTextSize);
window.addEventListener('load', adjustTextSize);

    </script>
</body>
</html>
