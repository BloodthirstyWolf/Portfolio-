<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кейс: Продвижение кафе</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: white;
            overflow-x: hidden;
        }
        .section {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }
        .hero {
            background: #fee6ed; /* Сплошной розовый фон */
            flex-direction: column;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .hero h1 {
            font-size: 3rem;
            color: white;
        }
        .hero p {
            font-size: 1.5rem;
            color: white;
            margin-top: 10px;
        }

        /* Параллакс изображения */
        .parallax-img {
            position: absolute;
            width: 15vw;
            height: auto;
            transition: transform 0.1s ease-out;
            z-index: 100;
            pointer-events: none;
        }

        .parallax-img.bg-1 {
            top: 20%;
            left: 5%;
            z-index: 1;
        }

        .parallax-img.bg-2 {
            top: 10%;
            left: 20%;
            z-index: 2;
        }

        .parallax-img.bg-3 {
            top: 60%;
            left: 50%;
            z-index: 3;
        }

        .parallax-img.bg-4 {
            top: 40%;
            left: 70%;
            z-index: 4;
        }

        .parallax-img.bg-5 {
            top: 80%;
            left: 85%;
            z-index: 5;
        }

        /* Новый фон для второго контейнера */
        .container2 {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #fee6ed, #dbeafe); /* Градиент от розового до голубого */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер с результатами */
        .result-container {
            width: 40%; /* Ширина 50%, можно настроить */
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10%;
            text-align: center;
        }

        /* Результаты - белые квадраты с круглыми краями */
        .result {
            background: white;
            width: 250px;  /* Размер статистики */
            height: 250px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .result:hover {
            transform: translateY(-5px);
        }

        .icon {
            font-size: 40px; /* Увеличиваем иконки */
        }

        .number {
            font-size: 48px; /* Увеличиваем числа */
            font-weight: bold;
            color: #ff4081;
            margin: 10px 0;
        }

        /* Мобильная версия */
        @media (max-width: 768px) {
            .result-container {
                grid-template-columns: 1fr; /* В столбик на мобильных */
            }

            .result {
                width: 90%; /* Делаем статистику шире на маленьких экранах */
                height: auto;
                margin-bottom: 20px;
            }

            .icon {
                font-size: 36px;
            }

            .number {
                font-size: 42px;
            }
        }
    
    </style>
</head>
<body>
    <!-- Первый контейнер -->
    <div class="section hero">
        <h1>Как я помогла кафе продвинуть уникальный продукт</h1>
        <p>Публикация привела к росту ссылочной массы и помогла бренду привлечь новых клиентов.</p>
        <img src="yogurt3.webp" class="parallax-img bg-1">
        <img src="yogurt4.webp" class="parallax-img bg-2">
        <img src="yogurt5.png" class="parallax-img bg-3">
        <img src="yogurt1.png" class="parallax-img bg-4">
        <img src="yogurt2.png" class="parallax-img bg-5">
    </div>
    
    <!-- Второй контейнер -->
    <div class="container2">
        <div class="result-container">
            <div class="result">
                <div class="icon">📈</div>
                <div class="number">10%</div>
                <p>Рост трафика извне</p>
            </div>
            <div class="result">
                <div class="icon">🕒</div>
                <div class="number">+35%</div>
                <p>Увеличение времени на странице</p>
            </div>
            <div class="result">
                <div class="icon">📝</div>
                <div class="number">5+</div>
                <p>Статей в топе</p>
            </div>
            <div class="result">
                <div class="icon">💬</div>
                <div class="number">X2</div>
                <p>Рост комментариев</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("mousemove", (e) => {
            // Слабый параллакс для задних изображений
            document.querySelectorAll(".parallax-img.bg-1, .parallax-img.bg-2").forEach(img => {
                let speed = 2; // Слабый параллакс
                let x = (window.innerWidth - e.pageX * speed) / 100;
                let y = (window.innerHeight - e.pageY * speed) / 100;
                img.style.transform = `translate(${x}px, ${y}px)`;
            });
            // Сильный параллакс для передних изображений
            document.querySelectorAll(".parallax-img.bg-3, .parallax-img.bg-4, .parallax-img.bg-5").forEach(img => {
                let speed = 5; // Сильный параллакс
                let x = (window.innerWidth - e.pageX * speed) / 100;
                let y = (window.innerHeight - e.pageY * speed) / 100;
                img.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
