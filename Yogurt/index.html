<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кейс: Продвижение кафе</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: white;
            overflow-x: hidden;
        }
        .section {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }
        .hero {
            background: #fee6ed; /* Сплошной розовый фон */
            flex-direction: column;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .hero h1 {
            font-size: 3rem;
            color: white;
        }
        .hero p {
            font-size: 1.5rem;
            color: white;
            margin-top: 10px;
        }
        .parallax-img {
            position: absolute;
            width: 15vw;
            height: auto;
            transition: transform 0.1s ease-out;
            z-index: 100;
            pointer-events: none;
        }
        .section:nth-child(even) {
            background: #dbeafe;
        }
        .section:nth-child(odd) {
            background: #fde2e4;
        }

        /* Новый градиентный фон для второго контейнера */
        .gradient-background {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to top, #fee6ed, #dbeafe); /* Градиент от розового снизу до голубого сверху */
            z-index: 2;
        }

        /* Стили для второго контейнера */
        .results-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            background: linear-gradient(to bottom, #fee6ed, #dbeafe); /* Градиент от розового сверху до голубого снизу */
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }

        .result {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out;
        }

        .result:hover {
            transform: translateY(-5px);
        }

        .icon {
            font-size: 32px;
        }

        .number {
            font-size: 36px;
            font-weight: bold;
            color: #ff4081;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="section hero">
        <h1>Как я помогла кафе продвинуть уникальный продукт</h1>
        <p>Публикация привела к росту ссылочной массы и помогла бренду привлечь новых клиентов.</p>
        <img src="yogurt1.png" class="parallax-img" style="top: 20%; left: 15%;">
        <img src="yogurt2.png" class="parallax-img" style="top: 50%; left: 50%;">
        <img src="yogurt1.png" class="parallax-img" style="top: 70%; left: 80%;">
        <!-- Новый сплошной фон для первого контейнера -->
        <div class="gradient-background"></div>
    </div>
    
    <!-- Контейнер 2 -->
    <div class="results-container">
        <div class="result">
            <div class="icon">📈</div>
            <div class="number">10%</div>
            <p>Рост трафика извне</p>
        </div>
        <div class="result">
            <div class="icon">🕒</div>
            <div class="number">+35%</div>
            <p>Увеличение времени на странице</p>
        </div>
        <div class="result">
            <div class="icon">📝</div>
            <div class="number">5+</div>
            <p>Статей в топе</p>
        </div>
        <div class="result">
            <div class="icon">💬</div>
            <div class="number">X2</div>
            <p>Рост комментариев</p>
        </div>
    </div>

    <script>
        // Для мобильных и десктопных устройств: параллакс через наклон устройства
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', function(event) {
                // Получаем угол наклона по осям
                let beta = event.beta; // Угол наклона по оси X (от -180 до 180)
                let gamma = event.gamma; // Угол наклона по оси Y (от -90 до 90)

                // Масштабируем значения для эффекта параллакса
                let x = gamma * 0.1;  // Степень влияния наклона по оси Y на движение по X
                let y = beta * 0.1;   // Степень влияния наклона по оси X на движение по Y

                // Применяем трансформацию для всех изображений
                document.querySelectorAll('.parallax-img').forEach(img => {
                    img.style.transform = `translate(${x}px, ${y}px)`;
                });
            });
        }
    </script>
</body>
</html>
